services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./artifacts:/app/artifacts"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  dashboard:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.headless", "true"]
    ports: ["127.0.0.1:8501:8501"]
    volumes: ["./artifacts:/app/artifacts", "./data:/app/data:ro", "./reports:/app/reports:ro"]
  train:
    build: .
    profiles: ["training"]
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/tracking/mlflow.db
    command: ["python", "-m", "src.models.train"]
    volumes: ["./artifacts:/app/artifacts", "./data:/app/data", "./reports:/app/reports", "tracking:/app/tracking", "mlruns:/app/mlruns"]

volumes:
  tracking:
  mlruns:
