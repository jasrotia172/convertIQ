seed: 42
test_size: 0.15
validation_size: 0.15
cv_folds: 3
search_iterations: 2
n_jobs: 2
selection_metric: average_precision
threshold:
  objective: f1
  minimum_precision: 0.3
segments:
  medium: 0.2
  high: 0.5
monitoring:
  psi_alert: 0.2
  js_alert: 0.1
  missing_alert: 0.01
  invalid_alert: 0.0
  latency_ms_alert: 500.0
  minimum_batch: 100
  minimum_average_precision: 0.3
  minimum_recall: 0.5
